<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>研究資料｜藝術創齡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAFBF8;--sheet:#fff;--ink:#1E2B3C;--soft:#56606E;--hydrangea:#4F6FAD;--wash:#E3E9F4;--line:#D5DBE5;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.85}
a{color:var(--hydrangea);text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--hydrangea);outline-offset:3px}
.bar{position:sticky;top:0;background:rgba(250,251,248,.94);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar div{max-width:820px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.bar a{text-decoration:none;font-size:15px}
.bar .home{font-family:var(--serif);font-weight:900;color:var(--ink);font-size:18px}
article{max-width:820px;margin:0 auto;padding:48px 24px calc(80px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);line-height:1.4}
h1{font-size:32px;margin:0 0 24px}
h2{font-size:24px;margin:48px 0 12px;padding-top:24px;border-top:1px solid var(--line)}
h3{font-size:19px;margin:32px 0 8px}
blockquote{margin:16px 0;padding:8px 20px;border-left:3px solid var(--hydrangea);background:var(--sheet);color:var(--ink)}
blockquote p{margin:.4em 0}
.table{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px;background:var(--sheet)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--wash)}
code{background:var(--wash);padding:1px 6px;font-size:14px}
pre{background:var(--sheet);border:1px solid var(--line);padding:16px;overflow-x:auto;font-size:14px;line-height:1.5}
pre code{background:none;padding:0}
hr{border:none;border-top:1px solid var(--line);margin:32px 0}
.msg{color:var(--soft)}
</style>
</head>
<body>
<div class="bar"><div><a class="home" href="index.html#data">← 藝術創齡</a><a id="raw" href="#">下載原始文字檔</a></div></div>
<article id="doc"><p class="msg">讀取中…</p></article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const f=new URLSearchParams(location.search).get('f')||'專案資料/README.md';
const doc=document.getElementById('doc');
if(!f.startsWith('專案資料/')||f.includes('..')){doc.innerHTML='<p class="msg">找不到這份文件。請回到首頁，從研究資料列表重新選擇。</p>';}
else{
  const url=f.split('/').map(encodeURIComponent).join('/');
  document.getElementById('raw').href=url;
  fetch(url).then(r=>{if(!r.ok)throw 0;return r.text()}).then(md=>{
    const base=f.slice(0,f.lastIndexOf('/')+1);
    doc.innerHTML=marked.parse(md);
    doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='table';t.before(w);w.appendChild(t)});
    doc.querySelectorAll('a[href]').forEach(a=>{
      const h=a.getAttribute('href');
      if(h.endsWith('.md')&&!/^https?:/.test(h)){a.href='viewer.html?f='+encodeURIComponent(base+h)}
    });
    const h1=doc.querySelector('h1'); if(h1) document.title=h1.textContent+'｜藝術創齡';
  }).catch(()=>{doc.innerHTML='<p class="msg">這份文件讀取失敗。請確認網站已上傳完整的「專案資料」資料夾，或回到首頁重新選擇。</p>';});
}
</script>
</body>
</html>
